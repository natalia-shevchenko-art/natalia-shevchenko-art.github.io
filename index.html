<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Natalia Shevchenko — Watercolour, Pastel, Coloured pencil</title>
<meta name="description" content="Original watercolour, pastel and coloured pencil paintings by Ukrainian realist artist Natalia Shevchenko: flowers, still life, animals and nature.">
<meta property="og:title" content="Natalia Shevchenko — Watercolour, Pastel, Coloured pencil">
<meta property="og:description" content="Original watercolour, pastel and coloured pencil paintings: flowers, still life, animals and nature.">
<meta property="og:image" content="https://natalia-shevchenko-art.github.io/img/works/03_roses-bouquet.jpg">
<meta property="og:url" content="https://natalia-shevchenko-art.github.io/">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>
<header class="top">
  <a class="brand" href="#home" data-name></a>
  <nav class="nav">
    <a href="#gallery" data-t="nav_gallery"></a>
    <a href="#about" data-t="nav_about"></a>
    <a href="#exhibitions" data-t="nav_exhibitions"></a>
    <a href="#contact" data-t="nav_contact"></a>
  </nav>
  <div class="langs" role="group" aria-label="Language"></div>
</header>

<main id="top">
  <section class="hero" data-page="gallery">
    <div class="hero-text">
      <p class="eyebrow" data-t="hero_eyebrow"></p>
      <h1 data-name></h1>
      <p class="lead" data-t="hero_lead"></p>
      <a class="btn" href="#gallery" data-t="hero_cta"></a>
    </div>
    <figure class="hero-img">
      <img src="img/works/03_roses-bouquet.jpg" width="1082" height="1600" alt="" data-alt="w03">
    </figure>
  </section>

  <section id="gallery" class="section" data-page="gallery">
    <h2 data-t="gallery_title"></h2>
    <div class="filters" role="group"></div>
    <div class="grid"></div>
    <aside class="teaser">
      <img src="img/about/artist-portrait.jpg" width="1100" height="1259" alt="" data-alt="alt_portrait" loading="lazy">
      <div>
        <p class="teaser-name" data-name></p>
        <p data-t="teaser_text"></p>
        <div class="teaser-links">
          <a class="btn" href="#about" data-t="teaser_about"></a>
          <a class="btn btn-dark" href="#contact" data-t="teaser_contact"></a>
        </div>
      </div>
    </aside>
  </section>

  <section id="about" class="section about" data-page="about">
    <figure class="about-img">
      <img src="img/about/artist-portrait.jpg" width="1100" height="1259" alt="" data-alt="alt_portrait" loading="lazy">
    </figure>
    <div class="about-text">
      <h2 data-t="about_title"></h2>
      <p data-t="about_p1"></p>
      <p data-t="about_p2"></p>
      <p data-t="about_p3"></p>
      <ul class="facts">
        <li data-t="fact_guild"></li>
        <li data-t="fact_museum"></li>
        <li data-t="fact_castle"></li>
        <li data-t="fact_award"></li>
      </ul>
    </div>
  </section>

  <section id="exhibitions" class="section" data-page="exhibitions">
    <h2 data-t="ex_title"></h2>
    <ol class="timeline"></ol>
    <div class="ex-photos">
      <figure><img src="img/about/poster-kamianets-2024.jpg" width="1157" height="1280" alt="" data-alt="alt_poster" loading="lazy"><figcaption data-t="cap_poster"></figcaption></figure>
      <figure><img src="img/about/exhibition-stone.jpg" width="720" height="720" alt="" data-alt="alt_stone" loading="lazy"><figcaption data-t="cap_stone"></figcaption></figure>
      <figure><img src="img/about/exhibition-butterflies.jpg" width="800" height="600" alt="" data-alt="alt_butterflies" loading="lazy"><figcaption data-t="cap_butterflies"></figcaption></figure>
    </div>
    <h3 class="docs-title" data-t="docs_title"></h3>
    <div class="ex-photos docs">
      <figure><a href="img/docs/golden-time-2021-1st-place.jpg" target="_blank" rel="noopener"><img src="img/docs/golden-time-2021-1st-place.jpg" width="937" height="1400" alt="" data-alt="cap_gt1" loading="lazy"></a><figcaption data-t="cap_gt1"></figcaption></figure>
      <figure><a href="img/docs/golden-time-2021-2nd-place.jpg" target="_blank" rel="noopener"><img src="img/docs/golden-time-2021-2nd-place.jpg" width="937" height="1400" alt="" data-alt="cap_gt2" loading="lazy"></a><figcaption data-t="cap_gt2"></figcaption></figure>
      <figure><a href="img/docs/guild-membership-2024.jpg" target="_blank" rel="noopener"><img src="img/docs/guild-membership-2024.jpg" width="1257" height="1400" alt="" data-alt="cap_guild" loading="lazy"></a><figcaption data-t="cap_guild"></figcaption></figure>
      <figure><a href="img/docs/certificate-ternopil-2024.jpg" target="_blank" rel="noopener"><img src="img/docs/certificate-ternopil-2024.jpg" width="1333" height="942" alt="" data-alt="cap_cert" loading="lazy"></a><figcaption data-t="cap_cert"></figcaption></figure>
      <figure><a href="img/docs/catalogue-ternopil-2024.jpg" target="_blank" rel="noopener"><img src="img/docs/catalogue-ternopil-2024.jpg" width="939" height="790" alt="" data-alt="cap_catalogue" loading="lazy"></a><figcaption data-t="cap_catalogue"></figcaption></figure>
    </div>
  </section>

  <section id="contact" class="section contact" data-page="contact">
    <h2 data-t="contact_title"></h2>
    <p data-t="contact_text"></p>
    <div class="contact-links"></div>
  </section>
</main>

<footer class="foot"><p data-t="footer"></p></footer>

<div class="lightbox" hidden>
  <button class="lb-close" aria-label="Close">&times;</button>
  <button class="lb-prev" aria-label="Previous">&#8249;</button>
  <figure>
    <img alt="">
    <figcaption><span class="lb-title"></span><span class="lb-meta"></span><a class="lb-ask" href="#contact" data-t="ask"></a></figcaption>
  </figure>
  <button class="lb-next" aria-label="Next">&#8250;</button>
</div>

<script src="data.js?v=4"></script>
<script src="app.js?v=4"></script>
</body>
</html>
